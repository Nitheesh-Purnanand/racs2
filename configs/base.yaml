seed: 42
image_size: 512
device: "cuda"
dtype: "float16"

generation:
  prompt: "a photograph of an astronaut riding a horse"   # TODO: replace with the paper's example Kpub
  num_inference_steps: 30
  guidance_scale: 7.5
  scheduler: "ddim"
  # sweep values used by the timing experiment:
  steps_sweep: [20, 30, 50]
  seeds_sweep: [42, 123]

retrieval:
  corpus_dir: "data/retrieval_images"
  metadata_dir: "data/metadata"
  index_path: "data/metadata/image_index.json"
  corpus_size: 1000          # frozen target; grow 1k -> 5k -> 10k later
  subset_seed: 42            # deterministic which images are picked
  canonical_size: 512        # stored image edge, matches SD/EDICT later
  resize_mode: "shortest_side_then_center_crop"   # documented, not implicit
  source: "coco_val2017"

embedding:
  model_id: "openai/clip-vit-base-patch32"   # ViT-B/32: 512-d, ~600 MB, fast on 6 GB
  model_path: "models/clip-vit-base-patch32" # self-contained download (scripts/phase5_fetch_model.py)
  embedding_dim: 512
  image_size: 224                            # CLIP native input; corpus 512 is resized
  batch_size: 32
  text_batch_size: 64
  dtype: "float32"                           # batch-size-invariant; fp16 differs ~7e-4 across batch sizes
  normalize: true                            # L2-normalise -> cosine == inner product
  device: "cuda"
  embeddings_path: "experiments/results/phase5_corpus_embeddings.npz"
  manifest_path: "experiments/results/phase5_corpus_embeddings.json"
  # Experiment 1: three topics x three paraphrases (group_sizes maps the split)
  text_prompt_groups: [3, 3, 3]
  text_prompts:
    - "a dog playing fetch in a park"
    - "a puppy running through grass"
    - "a golden retriever catching a ball"
    - "a red city bus on a street"
    - "a bus driving through traffic"
    - "a public transit bus at a stop"
    - "a plate of pasta with tomato sauce"
    - "a bowl of spaghetti on a table"
    - "italian pasta served on a white plate"
  # Experiment 3: free-text queries for cross-modal retrieval
  text_queries:
    - "a person riding a motorcycle"
    - "a plate of food on a table"
    - "a stop sign"
    - "people playing a sport"

semantic:
  cache_dir: "experiments/results/public_conditions"
  manifest_path: "experiments/results/public_conditions/manifest.json"
  keygen:
    method: "blip_template"          # blip_template | clip_vocab | local_llm
    model_id: "Salesforce/blip-image-captioning-base"
    model_path: null
    device: "cuda"
    dtype: "float16"
    max_new_tokens: 40
    num_beams: 1                     # greedy only, no sampling
    template: "a photorealistic photograph of {caption}, natural composition, detailed textures, realistic lighting"
    max_chars: 300
  features:
    common:
      method: "segformer"            # segformer | oneformer
      model_id: "nvidia/segformer-b0-finetuned-ade-512-512"
      model_path: null
      device: "cuda"
      dtype: "float16"
      output_size: 512
      num_classes: 150
    facial:
      method: "mediapipe"            # openpose | mediapipe (mediapipe is 6GB safe)
      output_size: 512
      min_keypoints: 5
    style:
      method: "none"                 # paper: style is Kpub-only

evaluation:
  splits_path: "data/metadata/test_split.json"
  tokens_path: "data/metadata/tokens.json"
  calibration_dir: "data/calibration/unistega"
  evaluation_dir: "data/test_set"
  image_size: 512
  classes: ["common", "facial", "style"]
  per_class: 22                      # 22 x 3 = 66 per role; UniStega has 22 clean faces
  total: 66
  snr_db: [5, 10, 15, 20]
  metrics: ["mse", "psnr", "ssim", "lpips"]
  lpips_net: "alex"                  # paper does not state one; frozen choice
  lpips_dtype: "float32"
  lpips_batch_size: 1                # deterministic and 6 GB safe
  report_percentiles: [5, 25, 50, 75, 95]
  raw_sources_dir: "data/_raw_sources"
  unistega:
    zip_path: "data/_raw_sources/unistega/Unistega.zip"
    drive_id: "1ITaNvYAP8hB32TxwEo4Rdf-515plUOdA"
    url: "https://drive.usercontent.google.com/download"
    class_map:
      content_prompts: "common"
      similar_prompts: "facial"
      style_prompts: "style"
  sources:
    coco:
      base_url: "http://images.cocodataset.org/val2017"
    facial:
      commons: "filetype:bitmap portrait photograph person face -painting -drawing -engraving"
      prefer_commons: true
      filter_human_face: true
    style:
      commons: "filetype:bitmap cat photograph"
      prefer_commons: true

edict:
  scheduler: "ddim"
  steps: 20
  mixing: 0.93
  image_size: 256
  latent_size: 32
  guidance_scale: 1.0
  dtype: "float16"
  latent_dtype: "float32"
  sweep_steps: [10, 20, 50]
  sweep_mixing: [0.5, 0.7, 0.93, 0.99]
  num_random_latents: 20
  num_image_latents: 20
  results_path: "experiments/results/phase10_edict.json"
  grid_path: "experiments/results/phase10_edict_sweep.png"
  max_rel_error: 0.005

reference:
  cache_dir: "experiments/results/references"
  manifest_path: "experiments/results/phase8_references.json"
  backend: "sd_controlnet"
  model_id: "stable-diffusion-v1-5/stable-diffusion-v1-5"
  controlnet_id: "lllyasviel/control_v11p_sd15_seg"
  facial_controlnet_id: "lllyasviel/control_v11p_sd15_openpose"
  use_ipadapter: false
  ipadapter_id: "h94/IP-Adapter"
  device: "cuda"
  dtype: "float16"
  scheduler: "ddim"
  steps: 20
  guidance_scale: 7.5
  eta: 0.0
  output_size: 256
  seed_scheme: "sha256_token_v1"
  max_peak_vram_gb: 5.5

controlnet_train:
  base_model_id: "stable-diffusion-v1-5/stable-diffusion-v1-5"
  controlnet_id: "lllyasviel/control_v11p_sd15_seg"
  train_role: "calibration"
  classes: ["common", "facial"]
  image_size: 256
  batch_size: 1
  grad_accum_steps: 1
  learning_rate: 0.00001
  max_steps: 50
  warmup_steps: 5
  dtype: "bfloat16"
  checkpoint_dir: "experiments/checkpoints"
  probe_size: 10
  probe_snr_db: 10

steganography:
  eta: 0.05
  mask_fraction: 0.05
  mask_domain: "racs2-mask-v1"
  edict_steps: 20
  edict_mixing: 0.93
  edict_strength: 0.2
  guidance_scale: 3.0
  image_size: 256
  latent_dtype: "float32"
  num_images: 20
  probe_class: "facial"
  results_dir: "experiments/results/phase11"
  manifest_path: "experiments/results/phase11_local.json"

channel:
  kind: "awgn"
  snr_db: [5, 10, 15, 20]
  h: 1.0
  complex_noise: true
  seed: 1234
  results_dir: "experiments/results/phase12"
  manifest_path: "experiments/results/phase12_awgn.json"
  curve_path: "experiments/results/phase12/phase12_awgn_curve.png"

codec:
  kind: "sd_vae_substitute"       # pretrained substitute; see docs/DEVIATIONS.md
  checkpoint: "stable-diffusion-v1-5/stable-diffusion-v1-5#vae"
  checkpoint_sha256: ""
  compression_ratio: 12            # 256x256x3 -> 32x32x4 at 256 px
  trained_snr_db: 10
  modulation: 64
  input_size: 256
  dtype: "float16"
  results_dir: "experiments/results/phase13"
  manifest_path: "experiments/results/phase13_codec.json"
  curve_path: "experiments/results/phase13/phase13_codec_curve.png"
  grid_path: "experiments/results/phase13/phase13_codec_grid.png"

enhancement:
  enabled: false
  kind: "codeformer"
  model_id: "sczhou/CodeFormer"
  fidelity_weight: 0.5
  classes: ["facial"]
  input_size: 256
  dtype: "float16"
  results_dir: "experiments/results/phase14"
  manifest_path: "experiments/results/phase14_codeformer.json"
  grid_path: "experiments/results/phase14/phase14_enhance_grid.png"

baseline:
  reference_config: "reference"
  edict_config: "edict"
  stego_config: "steganography"
  channel_config: "channel"
  codec_config: "codec"
  enhancement_config: "enhancement"
  snr_db: [5, 10, 15, 20]
  classes: ["common", "facial", "style"]
  calibration_output: "experiments/results/phase15A_calibration_table.json"
  evaluation_output: "experiments/results/baseline_table.json"
  calibration_manifest: "experiments/results/phase15A_manifest.json"
  evaluation_manifest: "experiments/results/baseline_manifest.json"
  calibration_grid: "experiments/results/calibration_baseline_grid.png"
  evaluation_grid: "experiments/results/baseline_grid.png"
  cases_dir: "experiments/results/baseline_cases"

security:
  split_role: "evaluation"
  conditions: ["correct", "wrong", "no_token"]
  snr_db: [5, 10, 15, 20]
  classes: ["common", "facial", "style"]
  output_security: "experiments/results/baseline_security.json"
  output_steganalysis: "experiments/results/baseline_steganalysis.json"
  manifest_path: "experiments/results/phase16_manifest.json"
  steganalysis:
    model: "xunet"
    input_size: 128
    train_fraction: 0.7
    val_fraction: 0.15
    test_fraction: 0.15
    epochs: 50
    batch_size: 8
    learning_rate: 0.001
    seed: 42
    cover_source: "evaluation_secret_images"
    snr_db: 10
    patch_grid: 2
    split_strategy: "2x2 non-overlapping patches per image, split grouped by image_id"
